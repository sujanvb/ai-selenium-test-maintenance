<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign In - Customer Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <span class="logo">CMS</span>
            <span>Customer Management System</span>
        </div>
    </header>

    <main class="container">

        <section class="form-card">

            <h2>Sign In</h2>
            <p class="subtitle">Access your customer management dashboard</p>

            <form id="loginForm">

                <div class="input-group">

                    <label for="userEmail">
                        Email Address
                    </label>

                    <input type="email"
                           id="userEmail"
                           placeholder="Enter your email address">

                </div>

                <div class="input-group">

                    <label for="userPassword">
                        Password
                    </label>

                    <input type="password"
                           id="userPassword"
                           placeholder="Enter your password">

                </div>

                <button type="button"
                        id="signInButton"
                        onclick="login()">
                    Sign In
                </button>

            </form>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
