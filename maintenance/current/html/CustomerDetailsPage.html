<html lang="en"><head>
    <meta charset="UTF-8">
    <title>Customer Details - Customer Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="check_gok_chrome_installed">

    <header>
        <h1>Customer Management System</h1>
    </header>

    <div class="container">

        <div class="card">

            <h2>Customer Details</h2>

            <div class="form-group">

                <label for="customerName">
                    Name
                </label>

                <input type="text" id="customerName">

            </div>

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email" id="email">

            </div>

            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input type="text" id="phone">

            </div>

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <input type="text" id="address">

            </div>

            <div class="actions">

                <button id="saveCustomer" onclick="saveCustomer()">
                    Save
                </button>

            </div>

        </div>

    </div>

    <script src="js/app.js"></script>



</body></html>
