<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Customer Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Customer Management System</h1>
    </header>

    <div class="container">

        <div class="card">
            <h2>Dashboard</h2>
            <p id="welcomeMessage">Welcome, Admin</p>
        </div>

        <div class="dashboard-grid">

            <div class="stat-card">
                <h2 id="customerCount">120</h2>
                <p>Customers</p>
            </div>

            <div class="stat-card">
                <h2 id="activeCustomerCount">98</h2>
                <p>Active</p>
            </div>

            <div class="stat-card">
                <h2 id="pendingCustomerCount">22</h2>
                <p>Pending</p>
            </div>

        </div>

        <div class="card">

            <button id="viewCustomersButton"
                    onclick="openCustomers()">
                View Customers
            </button>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
