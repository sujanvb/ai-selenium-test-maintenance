<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Customer Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <span class="logo">CMS</span>
            <span>Customer Management System</span>
        </div>
    </header>

    <main class="container">

        <section class="page-header">

            <div>
                <h2>Dashboard</h2>
                <p>Overview of your customer data</p>
            </div>

        </section>

        <section class="statistics">

            <article class="stat-card">
                <span class="stat-label">Total Customers</span>
                <strong id="customerCount">120</strong>
            </article>

            <article class="stat-card">
                <span class="stat-label">Active Customers</span>
                <strong id="activeCustomerCount">98</strong>
            </article>

            <article class="stat-card">
                <span class="stat-label">Pending Customers</span>
                <strong id="pendingCustomerCount">22</strong>
            </article>

            <article class="stat-card">
                <span class="stat-label">New Customers</span>
                <strong id="newCustomerCount">15</strong>
            </article>

        </section>

        <section class="content-card">

            <h3>Customer Management</h3>

            <p>
                View and manage customer information.
            </p>

            <button id="manageCustomersButton"
                    onclick="openCustomers()">
                Manage Customers
            </button>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
